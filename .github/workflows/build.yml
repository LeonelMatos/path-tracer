name: build

on:
  push:
  pull_request:

jobs:
  tests:
    name: BVH unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libglfw3-dev libglew-dev libglm-dev

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DBUILD_TESTS=ON

      - name: Build tests
        run: cmake --build build --target bvh_tests -j

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

  full-build:
    name: Full renderer build
    runs: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libglfw3-dev libglew-dev libglm-dev libassimp-dev

      - name: Download OpenImageDenoise 2.5.0
        run: |
          curl -L -o oidn.tar.gz https://github.com/RenderKit/oidn/releases/download/v2.5.0/oidn-2.5.0.x86_64.linux.tar.gz
          mkdir -p /tmp/oidn
          tar -xzf oidn.tar.gz -C /tmp/oidn --strip-components=1

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DOIDN_ROOT=/tmp/oidn

      - name: Build
        run: cmake --build build --target pathtracer -j